# OraxenBedrock 2.6.5 — Minecraft Java 1.20.5+
auto-generate:
  on-startup: true
  watch-files: true
  debounce-seconds: 5

paths:
  # Relative paths are resolved against the server directory.
  oraxen-directory: plugins/Oraxen
  # Leave blank to auto-detect Bukkit/Paper Geyser installations.
  geyser-directory: ""
  # Oraxen writes its generated Java pack here by default.
  java-pack: plugins/Oraxen/pack/pack.zip

pack:
  name: Oraxen Bedrock
  description: Automatically converted Oraxen resources
  # Namespace used only for generated Bedrock identifiers and files.
  # Java assets continue to resolve from Oraxen's "oraxen" namespace.
  namespace: oraxen
  # The first number is retained as the release major. The remaining numbers
  # are regenerated every time so Bedrock always downloads a fresh pack.
  version: [1, 0, 0]

conversion:
  items: true
  blocks: true
  # Generates Bedrock font/glyph_XX.png pages from Java bitmap font providers.
  glyphs-and-emojis: true
  # Converts assets/*/lang JSON files into Bedrock texts/*.lang files.
  localizations: true
  copy-sounds: true
  copy-ui-textures: true
  # Existing Bedrock files from plugins/OraxenBedrock/overrides/ are merged last.
  apply-overrides: true

logging:
  verbose: false
